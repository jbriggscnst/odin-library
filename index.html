<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="./script.js" defer></script>
</head>
<body>
    <button id="new-book-btn">New Book</button>
    
    <div class="content">
        <form id="book-form" hidden>
            <label for="title">Book title:</label>
            <input type="text" name="title" id="title" required>
            <label for="author">Author:</label>
            <input type="text" name="author" id="author" required>
            <label for="pages">Number of pages:</label>
            <input type="number" name="pages" id="pages" min="1" required>
            <fieldset>
                <legend>Have you read this book?</legend>
                <label for="read">Read</label>
                <input type="radio" name="readStatus" id="read" value="read" required>
                <label for="not-read">Not read</label>
                <input type="radio" name="readStatus" id="not-read" value="not-read">
            </fieldset>
        
            <button type="submit">Add Book</button>
        </form>
        <div class="library">
        
        </div>
    </div>

</body>
</html>
